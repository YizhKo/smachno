<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1A1A2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ЇжКо">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ЇжКо — Замовлення їжі</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F4EF;
  --dark:#1A1A2E;
  --dark2:#2D2D44;
  --accent:#C8873A;
  --accent2:#E8A458;
  --green:#2D6A4F;
  --red:#C0392B;
  --white:#FFFFFF;
  --card:#FFFFFF;
  --text:#1A1A2E;
  --soft:#6B6B80;
  --border:#E8E4DC;
  --r:14px;
  --sh:0 2px 16px rgba(0,0,0,0.08);
}
html,body{height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
#app{display:flex;flex-direction:column;height:100dvh;overflow:hidden}

/* TOPBAR */
.topbar{
  background:var(--dark);
  padding:14px 18px 12px;
  padding-top:max(14px,env(safe-area-inset-top));
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{font-size:26px}
.brand-name{
  font-family:'Playfair Display',serif;
  font-size:22px;font-weight:800;
  color:var(--white);letter-spacing:-0.5px;
}
.brand-name span{color:var(--accent)}
.brand-sub{font-size:10px;color:rgba(255,255,255,0.45);letter-spacing:1px;text-transform:uppercase;margin-top:1px}
.mode-toggle{display:flex;gap:3px;background:rgba(255,255,255,0.1);border-radius:10px;padding:4px}
.mode-btn{
  border:none;background:transparent;color:rgba(255,255,255,0.55);
  font-family:'Inter',sans-serif;font-size:11px;font-weight:600;
  padding:5px 12px;border-radius:7px;cursor:pointer;transition:all 0.18s;
}
.mode-btn.active{background:var(--accent);color:var(--white)}

/* TAB NAV */
.tab-nav{
  display:flex;background:var(--dark);
  border-bottom:1px solid rgba(255,255,255,0.08);flex-shrink:0;
}
.tab-btn{
  flex:1;border:none;background:transparent;
  color:rgba(255,255,255,0.45);font-family:'Inter',sans-serif;
  font-size:11px;font-weight:600;padding:9px 6px 8px;
  cursor:pointer;transition:all 0.18s;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  position:relative;letter-spacing:0.2px;
}
.tab-btn .ti{font-size:17px}
.tab-btn.active{color:var(--accent2)}
.tab-btn.active::after{
  content:'';position:absolute;bottom:0;left:25%;right:25%;
  height:2px;background:var(--accent);border-radius:2px 2px 0 0;
}
.badge{
  position:absolute;top:5px;right:18%;
  background:var(--accent);color:white;
  font-size:9px;font-weight:700;min-width:16px;height:16px;
  border-radius:8px;display:flex;align-items:center;justify-content:center;
  padding:0 4px;line-height:1;
}

/* CONTENT */
.content{flex:1;overflow-y:auto;overscroll-behavior:contain}
.panel{display:none;padding:14px}
.panel.active{display:block}

/* SECTION LABEL */
.sec-label{
  font-family:'Playfair Display',serif;
  font-size:18px;font-weight:700;color:var(--dark);
  margin:16px 0 10px 2px;display:flex;align-items:center;gap:8px;
}
.sec-label::after{content:'';flex:1;height:1px;background:var(--border)}
.sec-sub{font-size:11px;color:var(--soft);font-family:'Inter',sans-serif;font-weight:500}

/* MENU CARDS */
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px}

.menu-card{
  background:var(--card);border-radius:var(--r);
  box-shadow:var(--sh);overflow:hidden;cursor:pointer;
  transition:transform 0.12s,box-shadow 0.12s;
  position:relative;
}
.menu-card:active{transform:scale(0.97)}
.menu-card.in-cart{outline:2.5px solid var(--accent)}
.card-img{
  width:100%;height:90px;object-fit:cover;display:block;
  background:#E8E4DC;
}
.card-img-placeholder{
  width:100%;height:90px;
  background:linear-gradient(135deg,#e8e4dc,#d4cfc7);
  display:flex;align-items:center;justify-content:center;
  font-size:32px;
}
.card-body{padding:8px 10px 10px}
.card-name{font-size:12px;font-weight:700;color:var(--text);line-height:1.3}
.card-sub{font-size:10px;color:var(--soft);margin-top:2px;line-height:1.3}
.card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:7px;gap:4px}
.card-price{font-size:13px;font-weight:700;color:var(--dark);white-space:nowrap}
.card-actions{display:flex;align-items:center;gap:4px}
.tc-btn{
  border:1.5px solid var(--border);background:transparent;
  color:var(--soft);border-radius:6px;padding:3px 7px;
  font-family:'Inter',sans-serif;font-size:10px;font-weight:600;
  cursor:pointer;transition:all 0.15s;white-space:nowrap;
}
.tc-btn:hover{border-color:var(--accent);color:var(--accent)}
.add-btn{
  border:none;background:var(--accent);color:white;
  border-radius:8px;padding:4px 10px;font-family:'Inter',sans-serif;
  font-size:11px;font-weight:700;cursor:pointer;transition:background 0.15s;
  white-space:nowrap;
}
.card-qty{
  display:flex;align-items:center;gap:5px;
  background:var(--bg);border-radius:8px;padding:3px 7px;
}
.qty-btn{
  border:none;background:none;font-size:15px;font-weight:700;
  cursor:pointer;color:var(--dark);line-height:1;
  width:18px;height:18px;display:flex;align-items:center;justify-content:center;
}
.qty-val{font-size:12px;font-weight:800;min-width:14px;text-align:center}

/* CART */
.cart-empty{text-align:center;padding:48px 20px;color:var(--soft)}
.cart-empty .big{font-size:48px;margin-bottom:12px}
.cart-empty p{font-size:15px}

.cart-item{
  background:var(--card);border-radius:var(--r);
  box-shadow:var(--sh);display:flex;align-items:center;gap:10px;
  margin-bottom:10px;overflow:hidden;
}
.ci-img{width:64px;height:64px;object-fit:cover;flex-shrink:0}
.ci-img-ph{width:64px;height:64px;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.ci-info{flex:1;padding:8px 0;min-width:0}
.ci-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-price{font-size:11px;color:var(--soft);margin-top:2px}
.ci-right{display:flex;align-items:center;gap:8px;padding-right:12px}
.ci-qty{display:flex;align-items:center;gap:7px;background:var(--bg);border-radius:8px;padding:4px 9px}
.ci-qty-val{font-size:13px;font-weight:800;min-width:16px;text-align:center}
.ci-del{border:none;background:none;font-size:16px;cursor:pointer;opacity:0.35;padding:4px}

.order-summary{
  background:var(--dark);color:var(--white);
  border-radius:var(--r);padding:16px;margin:12px 0;
}
.sum-row{display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px;opacity:0.8}
.sum-row.total{font-size:17px;font-weight:700;opacity:1;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.15)}

/* ORDER FORM */
.form-card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:10px;box-shadow:var(--sh)}
.form-card label{font-size:11px;font-weight:700;color:var(--soft);display:block;margin-bottom:6px;letter-spacing:0.5px;text-transform:uppercase}
.form-card input,.form-card select{
  width:100%;border:1.5px solid var(--border);border-radius:9px;
  padding:11px 13px;font-family:'Inter',sans-serif;font-size:14px;
  outline:none;transition:border 0.15s;color:var(--text);background:var(--bg);
}
.form-card input:focus,.form-card select:focus{border-color:var(--accent);background:var(--white)}
.form-card input::placeholder{color:#aaa}

.submit-btn{
  width:100%;background:var(--accent);color:white;border:none;
  border-radius:var(--r);padding:16px;font-family:'Inter',sans-serif;
  font-size:15px;font-weight:700;cursor:pointer;margin-bottom:32px;
  transition:background 0.15s;letter-spacing:0.2px;
}
.submit-btn:hover{background:var(--accent2)}
.submit-btn:disabled{opacity:0.5;cursor:not-allowed}

/* ORDERS */
.orders-filter{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px}
.filter-chip{
  flex-shrink:0;border:1.5px solid var(--border);background:var(--card);
  border-radius:20px;padding:6px 14px;font-family:'Inter',sans-serif;
  font-size:11px;font-weight:700;cursor:pointer;color:var(--soft);
  transition:all 0.15s;white-space:nowrap;
}
.filter-chip.active{background:var(--dark);border-color:var(--dark);color:white}

.order-card{
  background:var(--card);border-radius:var(--r);
  box-shadow:var(--sh);padding:14px;margin-bottom:12px;
  border-left:4px solid var(--border);
}
.order-card.status-new{border-left-color:var(--accent)}
.order-card.status-preparing{border-left-color:#2980B9}
.order-card.status-ready{border-left-color:var(--green)}
.order-card.status-done{border-left-color:var(--border);opacity:0.6}

.order-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
.order-num{font-size:15px;font-weight:800;color:var(--dark)}
.order-time{font-size:11px;color:var(--soft)}
.order-customer{font-size:13px;color:var(--soft);margin-bottom:2px}
.order-ready-time{font-size:12px;font-weight:600;color:var(--accent);margin-bottom:8px}

.status-badge{font-size:11px;font-weight:700;border-radius:6px;padding:3px 9px;display:inline-block;margin-bottom:8px}
.status-badge.new{background:#FEF3C7;color:#92400E}
.status-badge.preparing{background:#DBEAFE;color:#1E40AF}
.status-badge.ready{background:#D1FAE5;color:#065F46}
.status-badge.done{background:#F3F4F6;color:#6B7280}

.order-items-list{margin:6px 0 10px}
.oi{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid var(--border)}
.oi:last-child{border-bottom:none}
.oi-qty{color:var(--soft);font-weight:700}
.order-total-line{font-size:12px;font-weight:700;color:var(--soft);margin-bottom:8px}
.order-phone{font-size:12px;color:var(--soft);margin-bottom:4px}
.order-address{font-size:12px;color:var(--soft);margin-bottom:4px}

.order-actions{display:flex;gap:8px;flex-wrap:wrap}
.action-btn{
  flex:1;min-width:70px;border:none;border-radius:9px;padding:8px 10px;
  font-family:'Inter',sans-serif;font-size:11px;font-weight:700;
  cursor:pointer;transition:all 0.15s;text-align:center;
}
.btn-prepare{background:#DBEAFE;color:#1E40AF}
.btn-ready{background:#D1FAE5;color:#065F46}
.btn-done{background:#F3F4F6;color:#6B7280}
.btn-cancel{background:#FEE2E2;color:#991B1B}

/* STATS */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat-card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;text-align:center}
.stat-icon{font-size:26px;margin-bottom:6px}
.stat-val{font-size:24px;font-weight:800;color:var(--dark)}
.stat-label{font-size:11px;color:var(--soft);margin-top:2px}
.stat-card.hi{background:var(--dark);color:white}
.stat-card.hi .stat-val{color:var(--accent2)}
.stat-card.hi .stat-label{color:rgba(255,255,255,0.55)}
.recent-item{
  background:var(--card);border-radius:10px;padding:10px 14px;
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:8px;box-shadow:0 1px 6px rgba(0,0,0,0.06);
}
.ri-name{font-size:13px;font-weight:700}
.ri-cust{font-size:11px;color:var(--soft)}
.ri-amount{font-size:14px;font-weight:800;color:var(--dark)}

/* MODAL */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.6);
  z-index:200;display:flex;align-items:flex-end;
  opacity:0;pointer-events:none;transition:opacity 0.25s;
}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal-box{
  background:var(--white);border-radius:20px 20px 0 0;
  width:100%;max-height:90dvh;overflow-y:auto;
  padding:0 0 32px;
  transform:translateY(60px);
  transition:transform 0.3s cubic-bezier(.34,1.2,.64,1);
}
.modal-overlay.open .modal-box{transform:translateY(0)}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 0}
.modal-dish-img{width:100%;height:180px;object-fit:cover;display:block}
.modal-dish-ph{width:100%;height:180px;background:linear-gradient(135deg,#e8e4dc,#ccc);display:flex;align-items:center;justify-content:center;font-size:56px}
.modal-head{padding:14px 18px 8px;position:relative}
.modal-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:800;color:var(--text)}
.modal-sub{font-size:13px;color:var(--soft);margin-top:3px}
.modal-price{font-size:18px;font-weight:800;color:var(--accent);margin-top:6px}
.modal-close{
  position:absolute;top:14px;right:16px;
  border:none;background:var(--bg);border-radius:50%;
  width:32px;height:32px;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:var(--soft);
}
.modal-body{padding:0 18px}
.tc-fact{
  background:linear-gradient(135deg,#FEF9F0,#FFF3E0);
  border-left:4px solid var(--accent);
  border-radius:10px;padding:12px 14px;margin-bottom:14px;
  font-size:13px;color:var(--text);line-height:1.6;
}
.tc-fact::before{content:'💡 '}
.tc-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.tc-meta-item{background:var(--bg);border-radius:10px;padding:10px 4px;text-align:center}
.tc-meta-val{font-size:15px;font-weight:800;color:var(--dark)}
.tc-meta-lbl{font-size:9px;color:var(--soft);margin-top:2px;line-height:1.3}
.tc-section{
  font-size:10px;font-weight:700;letter-spacing:0.7px;
  text-transform:uppercase;color:var(--soft);margin:12px 0 8px;
}
.tc-table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:14px}
.tc-table th{background:var(--dark);color:white;padding:7px 8px;text-align:left;font-weight:700}
.tc-table th:not(:first-child){text-align:right}
.tc-table td{padding:5px 8px;border-bottom:1px solid var(--border)}
.tc-table td:not(:first-child){text-align:right;color:var(--soft)}
.tc-table tfoot td{font-weight:700;border-top:2px solid var(--border);border-bottom:none}
.tc-tech{background:var(--bg);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.7;color:var(--text)}
.modal-add-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-top:1px solid var(--border);margin-top:14px;
}
.modal-add-btn{
  border:none;background:var(--accent);color:white;
  border-radius:10px;padding:12px 24px;font-family:'Inter',sans-serif;
  font-size:14px;font-weight:700;cursor:pointer;
}
.modal-qty-ctrl{display:flex;align-items:center;gap:12px}
.modal-qty-btn{
  border:1.5px solid var(--border);background:var(--bg);
  border-radius:50%;width:36px;height:36px;font-size:18px;font-weight:700;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--dark);
}
.modal-qty-val{font-size:18px;font-weight:800;min-width:24px;text-align:center}

/* OFFLINE / INSTALL */
.offline-bar{background:#B45309;color:white;text-align:center;font-size:12px;font-weight:700;padding:6px;display:none;flex-shrink:0}
.offline-bar.show{display:block}
.install-bar{background:var(--dark2);color:white;display:none;align-items:center;justify-content:space-between;padding:10px 16px;gap:10px;flex-shrink:0}
.install-bar.show{display:flex}
.install-bar p{font-size:12px;font-weight:600}
.inst-btn{border:none;border-radius:8px;padding:6px 12px;font-family:'Inter',sans-serif;font-size:11px;font-weight:700;cursor:pointer}
.inst-btn.pri{background:var(--accent);color:white}
.inst-btn.sec{background:transparent;color:rgba(255,255,255,0.5)}

/* TOAST */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--dark);color:white;border-radius:12px;
  padding:12px 22px;font-size:13px;font-weight:700;
  box-shadow:0 4px 20px rgba(0,0,0,0.2);transition:transform 0.3s cubic-bezier(.34,1.56,.64,1);
  z-index:999;white-space:nowrap;
}
.toast.show{transform:translateX(-50%) translateY(0)}

@media(min-width:480px){.menu-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:700px){
  #app{max-width:480px;margin:0 auto;box-shadow:0 0 40px rgba(0,0,0,0.12)}
  body{background:#E0DDD8;display:flex;justify-content:center}
}

  .card-img-svg{width:100%;height:90px;display:block;overflow:hidden;background:linear-gradient(145deg,#1a1a2e,#2d1b10)}
  .card-img-svg svg{width:100%;height:100%;display:block}
  .ci-img-svg{background:linear-gradient(145deg,#1a1a2e,#2d1b10)!important}
  .ci-img-svg svg{width:100%;height:100%;display:block}
  .modal-dish-svg{width:100%;height:200px;overflow:hidden;background:linear-gradient(145deg,#1a1a2e,#2d1b10);display:flex;align-items:center;justify-content:center}
  .modal-dish-svg svg{width:100%;height:100%;display:block}

  /* ── ADMIN PANEL ── */
  .admin-panel-wrap{padding:14px}
  .admin-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .admin-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:800;color:var(--dark)}
  .admin-pin-wrap{background:var(--card);border-radius:var(--r);padding:20px;margin-bottom:14px;box-shadow:var(--sh);text-align:center}
  .admin-pin-wrap p{font-size:13px;color:var(--soft);margin-bottom:12px}
  .admin-pin-input{
    width:160px;border:2px solid var(--border);border-radius:10px;
    padding:12px;font-size:22px;font-weight:800;text-align:center;
    letter-spacing:6px;font-family:'Inter',sans-serif;
    background:var(--bg);color:var(--dark);outline:none;
  }
  .admin-pin-input:focus{border-color:var(--accent)}
  .admin-pin-btn{
    display:block;width:100%;margin-top:12px;
    background:var(--accent);color:white;border:none;border-radius:10px;
    padding:12px;font-family:'Inter',sans-serif;font-size:14px;font-weight:700;cursor:pointer;
  }
  .admin-section-label{
    font-size:11px;font-weight:800;letter-spacing:0.7px;text-transform:uppercase;
    color:var(--soft);margin:14px 0 8px;
  }
  .admin-dish-row{
    background:var(--card);border-radius:12px;box-shadow:var(--sh);
    padding:11px 14px;margin-bottom:8px;
    display:flex;align-items:center;gap:12px;
  }
  .admin-dish-svg{width:48px;height:48px;border-radius:8px;overflow:hidden;flex-shrink:0;background:linear-gradient(145deg,#1a1a2e,#2d1b10)}
  .admin-dish-img{width:48px;height:48px;border-radius:8px;object-fit:cover;flex-shrink:0;display:block;background:#E8E4DC}
  .admin-dish-emoji{width:48px;height:48px;border-radius:8px;flex-shrink:0;background:linear-gradient(145deg,#1a1a2e,#2d1b10);display:flex;align-items:center;justify-content:center;font-size:20px}
  .admin-price-wrap{display:flex;align-items:center;gap:4px;margin-top:3px}
  .admin-price-input{
    width:56px;border:1.5px solid var(--border);border-radius:6px;
    padding:3px 5px;font-family:'Inter',sans-serif;font-size:12px;font-weight:700;
    color:var(--dark);background:var(--bg);outline:none;text-align:right;
  }
  .admin-price-input:focus{border-color:var(--accent);background:var(--white)}
  .admin-price-suffix{font-size:11px;color:var(--soft)}
  /* staff (kitchen access) gate */
  .staff-gate-wrap{background:var(--card);border-radius:var(--r);padding:26px 20px;margin-top:6px;text-align:center;box-shadow:var(--sh)}
  .staff-gate-icon{font-size:40px;margin-bottom:8px}
  .staff-gate-title{font-family:'Playfair Display',serif;font-size:17px;font-weight:800;color:var(--dark);margin-bottom:4px}
  .staff-gate-sub{font-size:12px;color:var(--soft);margin-bottom:16px;line-height:1.5}

// ── синхронізація замовлень між усіма пристроями через Firestore ──
let ordersSyncStarted = false;
let kitchenAudioCtx = null;
let kitchenAlertTimer = null;

function enableKitchenSound(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    if(!kitchenAudioCtx) kitchenAudioCtx = new AC();
    if(kitchenAudioCtx.state === 'suspended') kitchenAudioCtx.resume();
    showToast('🔔 Звук сповіщень кухні увімкнено');
  }catch(e){ console.warn('Kitchen sound unavailable',e); }
}

function playKitchenSound(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    if(!kitchenAudioCtx) kitchenAudioCtx = new AC();
    if(kitchenAudioCtx.state === 'suspended') return; // браузер потребує першої дії користувача
    const now = kitchenAudioCtx.currentTime;
    [0,0.22,0.44].forEach(function(offset){
      const osc=kitchenAudioCtx.createOscillator();
      const gain=kitchenAudioCtx.createGain();
      osc.type='sine'; osc.frequency.value=880;
      gain.gain.setValueAtTime(0.0001,now+offset);
      gain.gain.exponentialRampToValueAtTime(0.22,now+offset+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001,now+offset+0.18);
      osc.connect(gain); gain.connect(kitchenAudioCtx.destination);
      osc.start(now+offset); osc.stop(now+offset+0.2);
    });
  }catch(e){ console.warn('Kitchen sound error',e); }
}

function showKitchenNewOrderAlert(order){
  let el=document.getElementById('kitchenAlert');
  if(!el){
    el=document.createElement('div');
    el.id='kitchenAlert'; el.className='kitchen-alert';
    document.body.appendChild(el);
    el.addEventListener('click',function(){
      clearTimeout(kitchenAlertTimer); el.classList.remove('show');
      if(currentMode!=='kitchen') setMode('kitchen'); else showTab('orders');
    });
  }
  const count=(order.items||[]).reduce((sum,i)=>sum+(Number(i.qty)||0),0);
  el.innerHTML='<div class="kitchen-alert-icon">🔔</div><div class="kitchen-alert-text"><div class="kitchen-alert-title">Нове замовлення №'+order.num+'</div><div class="kitchen-alert-sub">'+(order.name||'Клієнт')+' · '+count+' порц. · '+(order.total||0)+' грн</div></div><div>›</div>';
  el.classList.add('show');
  clearTimeout(kitchenAlertTimer);
  kitchenAlertTimer=setTimeout(function(){el.classList.remove('show');},7000);
  playKitchenSound();
  if('Notification' in window && Notification.permission==='granted'){
    try{ new Notification('ЇжКо — нове замовлення №'+order.num,{body:(order.name||'Клієнт')+' · '+(order.total||0)+' грн'}); }catch(e){}
  }
}

function requestKitchenNotifications(){
  enableKitchenSound();
  if('Notification' in window && Notification.permission==='default') Notification.requestPermission().catch(()=>{});
}

function initOrdersSync(){
  if(!firebaseReady || !fbAuth || !fbAuth.currentUser) return;
  if(ordersSyncStarted) return;
  db.collection('orders').orderBy('num','desc').onSnapshot(function(snap){
    const incoming = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    if(ordersSyncStarted){
      snap.docChanges().forEach(function(change){
        if(change.type==='added' && change.doc.data().status==='new'){
          const order={id:change.doc.id,...change.doc.data()};
          if(currentMode==='kitchen' && kitchenUnlocked) showKitchenNewOrderAlert(order);
        }
      });
    }
    orders = incoming;
    ordersSyncStarted = true;
    updateOrdersBadge();
    const panel = document.getElementById('panel-orders');
    if(panel && panel.classList.contains('active')) renderOrders();
  }, function(err){ console.error('orders sync error', err); showToast('❌ Помилка синхронізації замовлень'); });
}
function nextOrderNumber(){
  // Не залежимо від meta/orderCounter: замовлення має відправлятися
  // навіть якщо транзакція лічильника недоступна.
  const key = 'yizhko_last_order_number';
  let cur = Number(localStorage.getItem(key) || orderCounter || 0);
  const next = Math.max(0, cur) + 1;
  localStorage.setItem(key, String(next));
  orderCounter = next;
  return Promise.resolve(next);
}

// Будує HTML для картинки страви. wrapClass — клас контейнера-заглушки
// (SVG/емодзі), imgClass — клас самого <img>, коли реальне фото є.
// Якщо фото немає або не завантажилось — показуємо SVG-ілюстрацію, а якщо й
// того немає — емодзі.
function dishFallbackHtml(item, svgClass, emojiClass){
  const svgData = DISH_SVGS[item.id];
  return svgData
    ? '<div class="' + svgClass + '">' + svgData + '</div>'
    : '<div class="' + emojiClass + '">' + item.emoji + '</div>';
}
function handleDishImgError(imgEl, id, svgClass, emojiClass){
  const item = MENU.find(i=>i.id===id);
  if(!item) return;
  imgEl.outerHTML = dishFallbackHtml(item, svgClass, emojiClass);
}
function dishImgHtml(item, svgClass, emojiClass, imgClass){
  const file = DISH_IMAGES[item.id];
  if(!file) return dishFallbackHtml(item, svgClass, emojiClass);
  const src = encodeURI(file);
  return '<img class="' + imgClass + '" src="' + src + '" alt="' + item.name + '" loading="lazy" onerror="handleDishImgError(this,' + item.id + ',\'' + svgClass + '\',\'' + emojiClass + '\')">';
}

// ══ STATE ══════════════════════════════════════════════════
let cart   = {};
let orders = loadOrders();
let currentFilter = 'all';
let currentMode   = 'client';
let deferredPrompt = null;
let orderCounter = orders.length ? Math.max(...orders.map(o=>o.num)) : 0;
let modalItemId  = null;
let modalQty     = 1;
let adminUnlocked = false;
let adminKitchenView = false;   // адмін дивиться кухню
let kitchenUnlocked = false;

// порції: завантажити зі сховища або ставимо 10 для всіх
function loadPortions(){
  try{
    const saved = JSON.parse(localStorage.getItem('yizhko_portions')||'{}');
    // default 10 for new items
    const out = {};
    MENU.forEach(i=>{ out[i.id] = (saved[i.id] !== undefined) ? saved[i.id] : 10; });
    return out;
  } catch{ const out={}; MENU.forEach(i=>out[i.id]=10); return out; }
}
function savePortions(p){ localStorage.setItem('yizhko_portions', JSON.stringify(p)); }
// init after MENU defined — filled below
let portions = {};

// ціни: завантажити збережені зі сховища й накласти поверх дефолтних з MENU
function loadPrices(){
  try{ return JSON.parse(localStorage.getItem('yizhko_prices')||'{}'); }
  catch{ return {}; }
}
function savePrices(p){ localStorage.setItem('yizhko_prices', JSON.stringify(p)); }
function applyStoredPrices(){
  const saved = loadPrices();
  MENU.forEach(i=>{ if(saved[i.id] !== undefined) i.price = saved[i.id]; });
}

function loadOrders(){
  try{ return JSON.parse(localStorage.getItem('yizhko_orders')||'[]'); }
  catch{ return []; }
}
function saveOrders(){ localStorage.setItem('yizhko_orders', JSON.stringify(orders)); }

// ══ RENDER MENU ═══════════════════════════════════════════
function renderMenu(){
  const cats = [...new Set(MENU.map(i=>i.cat))];
  let html = '';
  cats.forEach(cat=>{
    // filter out items with 0 portions (for client mode)
    const items = MENU.filter(i=>i.cat===cat && (currentMode!=='client' || (portions[i.id]||0)>0));
    if(!items.length) return;
    const catEmoji = {
      'Перші страви':'🍲','Основні страви':'🍽️','Гарніри':'🥔','Салати':'🥗','Окремі страви':'⭐'
    }[cat]||'🍴';
    html += '<div class="sec-label">' + catEmoji + ' ' + cat + '</div>';
    html += '<div class="menu-grid">';
    items.forEach(item=>{
      const qty = cart[item.id]||0;
      const imgTag = dishImgHtml(item, 'card-img-svg', 'card-img-placeholder', 'card-img');
      const qtyHtml = qty > 0
        ? '<div class="card-qty"><button class="qty-btn" onclick="event.stopPropagation();changeQty(' + item.id + ',-1)">−</button><span class="qty-val">' + qty + '</span><button class="qty-btn" onclick="event.stopPropagation();changeQty(' + item.id + ',1)">+</button></div>'
        : '<button class="add-btn" onclick="event.stopPropagation();changeQty(' + item.id + ',1)">+ Додати</button>';
      html += '<div class="menu-card' + (qty>0?' in-cart':'') + '" onclick="openTC(' + item.id + ')">'
        + imgTag
        + '<div class="card-body">'
        + '<div class="card-name">' + item.name + '</div>'
        + '<div class="card-sub">' + item.sub + '</div>'
        + '<div class="card-footer">'
        + '<div class="card-price">' + item.price + ' грн</div>'
        + '<div class="card-actions">'
        + (currentMode==='kitchen' ? '<button class="tc-btn" onclick="event.stopPropagation();openTC(' + item.id + ')">ТК</button>' : '')
        + qtyHtml
        + '</div></div></div></div>';
    });
    html += '</div>';
  });
  document.getElementById('menuContent').innerHTML = html;
}

function changeQty(id, delta){
  cart[id] = Math.max(0,(cart[id]||0)+delta);
  if(cart[id]===0) delete cart[id];
  updateCartBadge();
  renderMenu();
}
function updateCartBadge(){
  const total = Object.values(cart).reduce((s,v)=>s+v,0);
  const b = document.getElementById('cartBadge');
  b.textContent = total;
  b.style.display = total>0?'flex':'none';
}

// ══ RENDER CART ═══════════════════════════════════════════
function renderCart(){
  const keys = Object.keys(cart).map(Number);
  const el = document.getElementById('cartContent');
  if(!keys.length){
    el.innerHTML = '<div class="cart-empty"><div class="big">🛒</div><p>Кошик порожній.<br>Оберіть страви з меню.</p></div>';
    return;
  }
  let totalQty=0, totalPrice=0;
  let html='';
  keys.forEach(id=>{
    const item = MENU.find(i=>i.id===id);
    if(!item){ delete cart[id]; return; } // сторонню/видалену страву прибираємо з кошика
    const qty  = cart[id];
    totalQty  += qty;
    totalPrice+= qty*item.price;
    const imgHtml = dishImgHtml(item, 'ci-img-ph ci-img-svg', 'ci-img-ph', 'ci-img');
    html += '<div class="cart-item">'
      + imgHtml
      + '<div class="ci-info"><div class="ci-name">' + item.name + '</div>'
      + '<div class="ci-price">' + item.price + ' грн × ' + qty + ' = ' + (item.price*qty) + ' грн</div></div>'
      + '<div class="ci-right">'
      + '<div class="ci-qty"><button class="qty-btn" onclick="changeQty(' + id + ',-1)">−</button><span class="ci-qty-val">' + qty + '</span><button class="qty-btn" onclick="changeQty(' + id + ',1)">+</button></div>'
      + '<button class="ci-del" onclick="changeQty(' + id + ',-999)">✕</button>'
      + '</div></div>';
  });
  html += '<div class="order-summary">'
    + '<div class="sum-row"><span>Позицій</span><span>' + keys.length + '</span></div>'
    + '<div class="sum-row"><span>Порцій</span><span>' + totalQty + '</span></div>'
    + '<div class="sum-row total"><span>До сплати</span><span>' + totalPrice + ' грн</span></div>'
    + '</div>'
    + '<div class="form-card"><label>Ваше імʼя</label><input type="text" id="custName" placeholder="Олена Коваль" maxlength="50"></div>'
    + '<div class="form-card"><label>Номер телефону</label><input type="tel" id="custPhone" placeholder="+380 XX XXX XX XX" maxlength="20"></div>'
    + '<div class="form-card"><label>Адреса доставки</label><input type="text" id="custAddress" placeholder="вул. Шевченка, 10, кв. 5" maxlength="120"></div>'
    + '<div class="form-card"><label>Готове до (година)</label><input type="time" id="custTime" min="08:00" max="20:00"></div>'
    + '<button class="submit-btn" onclick="submitOrder()">✓ Оформити замовлення — ' + totalPrice + ' грн</button>';
  el.innerHTML = html;
  // set default time +30min
  const now = new Date();
  now.setMinutes(now.getMinutes()+30);
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  const timeEl = document.getElementById('custTime');
  if(timeEl) timeEl.value = hh+':'+mm;
}

function submitOrder(){
  const name    = document.getElementById('custName')?.value.trim();
  const phone   = document.getElementById('custPhone')?.value.trim();
  const address = document.getElementById('custAddress')?.value.trim();
  const time    = document.getElementById('custTime')?.value;
  if(!name)    { showToast('⚠️ Введіть імʼя'); return; }
  if(!phone)   { showToast('⚠️ Введіть номер телефону'); return; }
  if(!address) { showToast('⚠️ Вкажіть адресу доставки'); return; }
  if(!time)    { showToast('⚠️ Вкажіть час готовності'); return; }
  const items = Object.entries(cart).map(([id,qty])=>{
    const item = MENU.find(i=>i.id==id);
    return {id:+id, name:item.name, emoji:item.emoji, price:item.price, qty};
  });
  const total = items.reduce((s,i)=>s+i.price*i.qty,0);
  const submitBtn = document.querySelector('.submit-btn');
  if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = 'Оформлюємо…'; }
  nextOrderNumber().then(function(num){
    const baseOrder = {
      num, name, phone, address, time,
      items, total, status:'new',
      created: new Date().toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'}),
      date: new Date().toLocaleDateString('uk-UA'),
    };
    if(firebaseReady){
      console.log('ЇжКо: надсилаємо замовлення в Firestore', baseOrder);
      return db.collection('orders').add(
        Object.assign({}, baseOrder, {createdAt: firebase.firestore.FieldValue.serverTimestamp()})
      ).then(function(ref){
        console.log('ЇжКо: замовлення записано, ID:', ref.id);
        return ref;
      });
    } else {
      orders.unshift(baseOrder);
      saveOrders();
      return Promise.resolve();
    }
  }).then(function(){
    decreasePortions(items);
    cart={};
    updateCartBadge();
    updateOrdersBadge();
    showToast('✅ Замовлення прийнято!');
    showTab('orders');
  }).catch(function(e){
    console.error(e);
    showToast('❌ Не вдалося надіслати замовлення. Перевірте інтернет.');
  }).finally(function(){
    if(submitBtn){ submitBtn.disabled = false; }
  });
}

      + order.items.map(i=>'<div class="oi"><span>' + i.emoji + ' ' + i.name + '</span><span class="oi-qty">' + i.qty + ' шт.</span></div>').join('')
      + '</div>'

      + (order.status==='new' ? '<button class="action-btn btn-prepare" onclick="setStatus(' + order.num + ',\'preparing\')">🔵 Готувати</button>' : '')
      + (order.status==='preparing' ? '<button class="action-btn btn-ready" onclick="setStatus(' + order.num + ',\'ready\')">🟢 Готово</button>' : '')
      + (order.status==='ready' ? '<button class="action-btn btn-done" onclick="setStatus(' + order.num + ',\'done\')">✓ Видано</button>' : '')
      + (order.status!=='done' ? '<button class="action-btn btn-cancel" onclick="cancelOrder(' + order.num + ')">✕ Скасувати</button>' : '')

function setStatus(num,status){
  const o = orders.find(o=>o.num===num);
  if(!o) return;
  const labels={preparing:'готується',ready:'готово!',done:'видано'};
  if(firebaseReady && o.id){
    db.collection('orders').doc(o.id).update({status})
      .then(()=>showToast('№' + num + ': ' + (labels[status]||status)))
      .catch(()=>showToast('❌ Не вдалося оновити статус'));
  } else {
    o.status=status; saveOrders(); updateOrdersBadge(); renderOrders();
    showToast('№' + num + ': ' + (labels[status]||status));
  }
}
function cancelOrder(num){
  const o = orders.find(o=>o.num===num);
  if(!o) return;
  if(firebaseReady && o.id){
    db.collection('orders').doc(o.id).delete()
      .then(()=>showToast('Замовлення №' + num + ' скасовано'))
      .catch(()=>showToast('❌ Не вдалося скасувати замовлення'));
  } else {
    orders=orders.filter(o=>o.num!==num);
    saveOrders(); updateOrdersBadge(); renderOrders();
    showToast('Замовлення №' + num + ' скасовано');
  }
}
function filterOrders(f){
  currentFilter=f;
  document.querySelectorAll('.filter-chip').forEach(btn=>{
    const map={all:'Усі',new:'Нові',preparing:'Готується',ready:'Готово',done:'Видано'};
    btn.classList.toggle('active', btn.textContent.trim().includes(map[f]));
  });
  renderOrders();
}
function updateOrdersBadge(){
  const active=orders.filter(o=>o.status!=='done').length;
  const b=document.getElementById('ordersBadge');

}

async function kitchenSignIn(){
  const email = document.getElementById('kitchenLoginEmail')?.value.trim();
  const pass  = document.getElementById('kitchenLoginPass')?.value;
  if(!email || !pass){ showToast('❌ Введіть email і пароль'); return; }
  try{
    await fbAuth.signInWithEmailAndPassword(email, pass);
    // onAuthStateChanged нижче сам обробить
  }catch(e){
    showToast('❌ Невірний email або пароль');
  }
}

async function verifyKitchenAccess(uid){
  if(!firebaseReady || !db || !uid) return false;
  try{
    const snap = await db.collection('kitchen_users').doc(uid).get();
    const ok   = snap.exists && snap.data().status === 'approved';
    if(!ok){ kitchenUnlocked = false; return false; }
    kitchenUnlocked = true;
    currentMode = 'kitchen';
    document.getElementById('modeKitchen').classList.add('active');
    document.getElementById('modeClient').classList.remove('active');
    document.getElementById('ordersFilter').style.display = '';
    showTab('orders');
    requestKitchenNotifications();
    initOrdersSync();
    return true;
  }catch(e){ console.error(e); return false; }
}

async function submitKitchenRequest(){
  const name  = (document.getElementById('staffName')?.value  || '').trim();
  const phone = (document.getElementById('staffPhone')?.value || '').trim();
  const email = (document.getElementById('staffEmail')?.value || '').trim();
  const pass  = (document.getElementById('staffPass')?.value  || '');

  if(!name)                     { showToast('❌ Введіть ім’я'); return; }
  if(normalizePhone(phone).length < 9){ showToast('❌ Введіть коректний номер телефону'); return; }
  if(!email || !email.includes('@')){ showToast('❌ Введіть коректний email'); return; }
  if(pass.length < 6)           { showToast('❌ Пароль має бути мінімум 6 символів'); return; }
  if(!firebaseReady || !db || !fbAuth){ showToast('⚠️ Firebase не підключено'); return; }

  try{
    // 1. створюємо акаунт
    let cred;
    try{
      cred = await fbAuth.createUserWithEmailAndPassword(email, pass);
    }catch(e){
      if(e.code === 'auth/email-already-in-use'){
        // можливо, заявку вже подано раніше — спробуємо увійти
        try{
          cred = await fbAuth.signInWithEmailAndPassword(email, pass);
        }catch(_){
          showToast('❌ Цей email уже зареєстровано з іншим паролем');
          return;
        }
      } else if(e.code === 'auth/weak-password'){
        showToast('❌ Пароль занадто простий');
        return;
      } else {
        showToast('❌ ' + (e.message || 'Помилка реєстрації'));
        return;
      }
    }
    const uid = cred.user.uid;

    // 2. заявка
    const docRef = db.collection('kitchen_access').doc(normalizePhone(phone));
    const snap   = await docRef.get();
    if(snap.exists){
      const data = snap.data();
      if(data.uid && data.uid !== uid){
        showToast('⛔ Цей номер уже прив’язано до іншого акаунта');
        return;
      }
      if(data.status === 'approved'){
        await verifyKitchenAccess(uid);
        if(kitchenUnlocked) showToast('✅ Доступ підтверджено!');
        return;
      }
      await docRef.update({ name, phone, email, uid,
        requestedAt: firebase.firestore.FieldValue.serverTimestamp() });
    } else {
      await docRef.set({
        phone, name, email, uid,
        status: 'pending',
        requestedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }
    renderKitchenStatus(normalizePhone(phone), 'pending');
  }catch(e){
    console.error(e);
    showToast('❌ Помилка з’єднання. Спробуйте ще раз.');
  }
}

function renderKitchenStatus(phone, status){
  const msg = status==='pending'
    ? { icon:'⏳', title:'Заявку подано', sub:'Очікуйте підтвердження від адміністратора. Після схвалення натисніть "Увійти".' }
    : { icon:'⛔', title:'Доступ відхилено', sub:'Зверніться до адміністратора закладу.' };
  document.getElementById('ordersContent').innerHTML =
    '<div class="staff-gate-wrap">'
    + '<div class="staff-gate-icon">' + msg.icon + '</div>'
    + '<div class="staff-gate-title">' + msg.title + '</div>'
    + '<div class="staff-gate-sub">' + msg.sub + '</div>'
    + '<button class="staff-btn" onclick="checkKitchenStatus(\'' + phone + '\')">Перевірити статус</button>'
    + '<button class="staff-btn" onclick="kitchenSignInForm()">Увійти (якщо схвалено)</button>'
    + '<button class="staff-btn sec" onclick="renderKitchenGate()">← Назад</button>'
    + '</div>';
}

async function checkKitchenStatus(phone){
  if(!firebaseReady || !db) return;
  try{
    const snap = await db.collection('kitchen_access').doc(phone).get();
    if(!snap.exists){ showToast('Заявку не знайдено'); return; }
    const data = snap.data();
    if(data.status === 'approved' && data.uid){
      const ok = await verifyKitchenAccess(data.uid);
      if(ok) showToast('✅ Доступ підтверджено!');
      else   showToast('⛔ Ще не схвалено адміністратором');
    } else if(data.status === 'pending'){
      renderKitchenStatus(phone, 'pending');
      showToast('⏳ Ще очікує підтвердження');
    } else {
      renderKitchenStatus(phone, data.status);
      showToast('Доступ відхилено');
    }
  }catch(e){ showToast('❌ Не вдалося перевірити. Перевірте з’єднання.'); }
}


// ══ ADMIN PANEL ═══════════════════════════════════════════
function renderAdmin(){
  const el = document.getElementById('adminContent');
  if(!adminUnlocked){
    el.innerHTML = '<div class="admin-panel-wrap">'
      + '<div class="admin-pin-wrap">'
      + '<p style="font-size:13px;color:var(--soft);margin-bottom:14px">🔐 Вхід для адміністратора</p>'
      + '<input type="email" id="adminEmailInput" class="admin-pin-input" style="width:100%;font-size:14px;letter-spacing:0;margin-bottom:10px" placeholder="Email адміна">'
      + '<input type="password" id="adminPassInput" class="admin-pin-input" style="width:100%;font-size:14px;letter-spacing:2px;margin-bottom:10px" placeholder="Пароль">'
      + '<button class="admin-pin-btn" id="adminSignInBtn" onclick="adminSignIn()">Увійти</button>'
      + '<p id="adminSignInErr" style="color:#C0392B;font-size:11px;margin-top:8px;min-height:16px"></p>'
      + '</div></div>';
    setTimeout(()=>{ const inp=document.getElementById('adminEmailInput'); if(inp) inp.focus(); },100);
    return;
  }
  // unlocked — show portions editor
  const cats = [...new Set(MENU.map(i=>i.cat))];
  let html = '<div class="admin-panel-wrap">'
    + '<div class="admin-header"><div class="admin-title">⚙️ Адмін-панель</div>'
    + '<button onclick="adminSignOut()" style="border:none;background:var(--border);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;color:var(--soft)">Вийти</button>'
    + '</div>';
  cats.forEach(cat=>{
    html += '<div class="admin-section-label">' + cat + '</div>';
    MENU.filter(i=>i.cat===cat).forEach(item=>{
      const p = portions[item.id]||0;
      const svg = dishImgHtml(item, 'admin-dish-svg', 'admin-dish-emoji', 'admin-dish-img');
      html += '<div class="admin-dish-row' + (p===0?' sold-out':'') + '" id="arow-' + item.id + '">'
        + svg
        + '<div class="admin-dish-info"><div class="admin-dish-name">' + item.name + '</div>'
        + '<div class="admin-price-wrap"><input type="number" class="admin-price-input" id="apv-' + item.id + '" value="' + item.price + '" min="0" step="1" onclick="event.stopPropagation()"><span class="admin-price-suffix">грн</span></div></div>'
        + '<div class="admin-qty-wrap">'
        + '<button class="admin-qty-btn" onclick="adminQty(' + item.id + ',-1)">−</button>'
        + '<span class="admin-qty-val' + (p===0?' zero':'') + '" id="aqv-' + item.id + '">' + p + '</span>'
        + '<button class="admin-qty-btn" onclick="adminQty(' + item.id + ',1)">+</button>'
        + '<button class="admin-qty-btn" onclick="adminQty(' + item.id + ',10)" title="+10" style="font-size:11px;width:auto;border-radius:8px;padding:0 8px">+10</button>'
        + '</div>'
        + (p===0 ? '<span class="sold-out-badge">Немає</span>' : '<span class="avail-badge">' + p + ' пор.</span>')
        + '</div>';
    });
  });
  html += '<button class="admin-save-btn" onclick="adminSave()">💾 Зберегти та оновити меню</button>';
  html += renderKitchenAdminSectionHtml();
  html += '</div>';
  el.innerHTML = html;
  if(staffAuthed) loadKitchenRequests();
}

// ── секція "Доступ для кухні" всередині адмінки ──
let staffAuthed = false;

// ── Єдиний onAuthStateChanged: обробляє і адміна і кухню ──
if(firebaseReady && fbAuth){
  fbAuth.onAuthStateChanged(async function(user){
    const provider = user && user.providerData && user.providerData[0] ? user.providerData[0].providerId : '';
    const isAdminSession = !!user && provider === 'password' && user.uid === ADMIN_UID;
    const isOtherPassword = !!user && provider === 'password' && !isAdminSession;
    staffAuthed = isAdminSession;

    // ── АДМІН ──
    if(isAdminSession){
      adminUnlocked = true;
      currentMode = 'admin';
      document.getElementById('modeAdmin').classList.add('active');
      document.getElementById('modeClient').classList.remove('active');
      document.getElementById('modeKitchen').classList.remove('active');
      document.getElementById('tab-admin').style.display = 'flex';
      renderAdmin();
      showTab('admin');
      showToast('✅ Вхід адміністратора');
      initOrdersSync();
      return;
    }

    // ── КУХАР (email/пароль, не адмін) ──
    if(isOtherPassword){
      adminUnlocked = false;
      const ok = await verifyKitchenAccess(user.uid);
      if(ok){
        showToast('✅ Доступ кухні підтверджено');
        initOrdersSync();
      } else {
        // не схвалено — показуємо форму заявки
        kitchenUnlocked = false;
        currentMode = 'client';
        document.getElementById('modeKitchen').classList.remove('active');
        document.getElementById('modeClient').classList.add('active');
        showTab('orders');
        renderKitchenGate();
        showToast('⏳ Вашу заявку ще не схвалено');
      }
      return;
    }

    // ── ГОСТЬ ──
    if(!user){
      if(adminUnlocked || kitchenUnlocked){
        adminUnlocked  = false;
        kitchenUnlocked = false;
        staffAuthed    = false;
        currentMode    = 'client';
        document.getElementById('modeClient').classList.add('active');
        document.getElementById('modeAdmin').classList.remove('active');
        document.getElementById('modeKitchen').classList.remove('active');
        document.getElementById('tab-admin').style.display = 'none';
        showTab('menu');
      }
    }
  });
}

function renderKitchenAdminSectionHtml(){
    const kitchenSwitchBtn = '<button class="staff-btn" style="margin-top:8px" onclick="adminOpenKitchen()">👩‍🍳 Перейти в режим кухні</button>';
  if(!firebaseReady){
    return '<div class="admin-section-label" style="margin-top:22px">🔑 Доступ для кухні</div>'
      + '<div class="staff-admin-login"><p class="staff-admin-hint">Firebase ще не підключено в коді сайту (розділ FIREBASE на початку файлу) — без цього заявки працівників зберігатися не будуть.</p></div>';
  }
  if(!staffAuthed){
    return '<div class="admin-section-label" style="margin-top:22px">🔑 Доступ для кухні</div>'
      + '<div class="staff-admin-login">'
      + '<input type="email" id="staffAdminEmail" class="staff-admin-input" placeholder="Email адміна">'
      + '<input type="password" id="staffAdminPass" class="staff-admin-input" placeholder="Пароль">'
      + '<button class="staff-btn" onclick="staffAdminSignIn()">Увійти й керувати заявками</button>'
      + '<p class="staff-admin-hint">Це окремий, захищений вхід (Firebase Authentication) — саме він відкриває схвалення заявок кухні, PIN вище на це не впливає.</p>'
      + '</div>';
  }
  return '<div class="admin-section-label" style="margin-top:22px">🔑 Доступ для кухні</div>'
    + kitchenSwitchBtn
    + '<div id="kitchenReqList"><p class="staff-admin-hint">Завантаження заявок…</p></div>'
    + '<button class="staff-btn sec" onclick="staffAdminSignOut()">Вийти з керування кухнею</button>';
}

function adminOpenKitchen(){
  if(!adminUnlocked){ showToast('Спочатку увійдіть як адмін'); return; }
  adminKitchenView = true;
  kitchenUnlocked  = true;
  setMode('kitchen');
  showToast('👩‍🍳 Режим кухні (як адмін)');
}

function staffAdminSignIn(){
  const email = document.getElementById('staffAdminEmail')?.value.trim();
  const pass  = document.getElementById('staffAdminPass')?.value;
  if(!email || !pass) return;
  fbAuth.signInWithEmailAndPassword(email, pass)
    .then(()=>{ showToast('✅ Вхід виконано'); })
    .catch(()=>{ showToast('❌ Невірний email або пароль'); });
}
function staffAdminSignOut(){
  fbAuth.signOut();
}

async function loadKitchenRequests(){
  const el = document.getElementById('kitchenReqList');
  if(!el || !db) return;
  try{
    const snap = await db.collection('kitchen_access').get();
    if(snap.empty){ el.innerHTML = '<p class="staff-admin-hint">Заявок ще немає.</p>'; return; }
    let html = '';
    snap.forEach(doc=>{
      const d = doc.data();
      const badge = d.status==='approved'
        ? '<span class="avail-badge">Схвалено</span>'
        : d.status==='rejected'
          ? '<span class="staff-badge-rejected">Відхилено</span>'
          : '<span class="staff-badge-pending">Очікує</span>';
      html += '<div class="admin-dish-row">'
        + '<div class="admin-dish-info"><div class="admin-dish-name">' + (d.name || 'Без імені') + '</div>'
        + '<div class="admin-dish-cat">' + (d.phone || doc.id) + (d.email ? ' · ' + d.email : '') + '</div></div>'
        + badge
        + '<div class="admin-qty-wrap">'
        + (d.status!=='approved' ? '<button class="admin-qty-btn" title="Схвалити" onclick="staffSetStatus(\'' + doc.id + '\',\'approved\')">✓</button>' : '<button class="admin-qty-btn" title="Скасувати доступ" onclick="staffSetStatus(\'' + doc.id + '\',\'rejected\')">⛔</button>')
        + (d.status!=='rejected' && d.status!=='approved' ? '<button class="admin-qty-btn" title="Відхилити" onclick="staffSetStatus(\'' + doc.id + '\',\'rejected\')">✕</button>' : '')
        + '</div></div>';
    });
    el.innerHTML = html;
  }catch(e){
    el.innerHTML = '<p class="staff-admin-hint">Помилка завантаження заявок. Перевірте правила безпеки Firestore.</p>';
  }
}

async function staffSetStatus(phoneId, status){
  try{
    const ref=db.collection('kitchen_access').doc(phoneId), snap=await ref.get(); if(!snap.exists){showToast('❌ Заявку не знайдено');return;}
    const data=snap.data(); if(status==='approved'&&!data.uid){showToast('⚠️ Стара заявка без UID. Працівник має подати заявку ще раз.');return;}
    await ref.update({status});
    if(data.uid){const uref=db.collection('kitchen_users').doc(data.uid); if(status==='approved') await uref.set({phone:phoneId,status:'approved',approvedAt:firebase.firestore.FieldValue.serverTimestamp()}); else await uref.delete().catch(()=>{});}
    showToast(status==='approved'?'✅ Доступ схвалено':'⛔ Доступ скасовано/відхилено'); loadKitchenRequests();
  }catch(e){console.error(e);showToast('❌ Помилка. Перевірте правила безпеки Firestore.');}
}

async function adminSignIn(){
  if(!firebaseReady || !fbAuth){
    showToast('❌ Firebase не підключено');
    return;
  }
  const email = document.getElementById('adminEmailInput')?.value.trim();
  const pass  = document.getElementById('adminPassInput')?.value;
  const errEl = document.getElementById('adminSignInErr');
  const btn   = document.getElementById('adminSignInBtn');
  if(!email || !pass){
    if(errEl) errEl.textContent = 'Введіть email і пароль';
    return;
  }
  if(btn){ btn.disabled = true; btn.textContent = 'Вхід…'; }
  try {
    await fbAuth.signInWithEmailAndPassword(email, pass);
    // onAuthStateChanged нижче спрацює і відкриє адмінку
  } catch(e) {
    if(btn){ btn.disabled = false; btn.textContent = 'Увійти'; }
    if(errEl) errEl.textContent = 'Невірний email або пароль';
    showToast('❌ Невірний email або пароль');
  }
}

function adminSignOut(){
  if(fbAuth) fbAuth.signOut();
  adminUnlocked = false;
  currentMode = 'client';
  document.getElementById('modeClient').classList.add('active');
  document.getElementById('modeAdmin').classList.remove('active');
  document.getElementById('modeKitchen').classList.remove('active');
  document.getElementById('tab-admin').style.display = 'none';
  showTab('menu');
  showToast('Вийшли з адмін-режиму');
}

function adminQty(id, delta){
  portions[id] = Math.max(0, (portions[id]||0) + delta);
  // update UI without full re-render
  const valEl = document.getElementById('aqv-' + id);
  const rowEl = document.getElementById('arow-' + id);
  const badgeEl = rowEl?.querySelector('.sold-out-badge, .avail-badge');
  if(valEl){
    valEl.textContent = portions[id];
    valEl.className = 'admin-qty-val' + (portions[id]===0?' zero':'');
  }
  if(rowEl) rowEl.className = 'admin-dish-row' + (portions[id]===0?' sold-out':'');
  if(badgeEl){
    badgeEl.className = portions[id]===0 ? 'sold-out-badge' : 'avail-badge';
    badgeEl.textContent = portions[id]===0 ? 'Немає' : portions[id]+' пор.';
  }
}

function adminSave(){
  // зчитати ціни з полів вводу та застосувати до MENU
  let changedPrices = false;
  MENU.forEach(item=>{
    const inp = document.getElementById('apv-' + item.id);
    if(!inp) return;
    const val = parseFloat(inp.value);
    if(!isNaN(val) && val >= 0 && val !== item.price){
      item.price = val;
      changedPrices = true;
    }
  });
  if(changedPrices){
    const priceMap = {};
    MENU.forEach(i=>{ priceMap[i.id] = i.price; });
    savePrices(priceMap);
  }
  savePortions(portions);
  showToast('✅ Збережено! Меню оновлено.');
  // re-render menu so client immediately sees changes
  renderMenu();
}

function logoutAdmin(){ adminSignOut(); }

// ── also decrease portions when order submitted ──
function decreasePortions(items){
  items.forEach(item=>{
    if(portions[item.id] !== undefined && portions[item.id] > 0){
      portions[item.id] = Math.max(0, portions[item.id] - item.qty);
    }
  });
  savePortions(portions);
}

// ══ TOAST ═════════════════════════════════════════════════
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}

// ══ PWA ═══════════════════════════════════════════════════
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault(); deferredPrompt=e;
  document.getElementById('installBar').classList.add('show');
});
document.getElementById('installBtn').addEventListener('click',async()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  const {outcome}=await deferredPrompt.userChoice;
  deferredPrompt=null;
  document.getElementById('installBar').classList.remove('show');
  if(outcome==='accepted') showToast('✅ Додаток встановлено!');
});
document.getElementById('installDismiss').addEventListener('click',()=>{
  document.getElementById('installBar').classList.remove('show');
});
window.addEventListener('online', ()=>document.getElementById('offlineBar').classList.remove('show'));
window.addEventListener('offline',()=>document.getElementById('offlineBar').classList.add('show'));

// ══ INIT ══════════════════════════════════════════════════
applyStoredPrices();
portions = loadPortions();
updateKitchenButtonVisibility();
updateCartBadge();
updateOrdersBadge();
renderMenu();
</script>
