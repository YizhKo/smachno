<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1A1A2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ЇжКо">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ЇжКо — Замовлення їжі</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F4EF;
  --dark:#1A1A2E;
  --dark2:#2D2D44;
  --accent:#C8873A;
  --accent2:#E8A458;
  --green:#2D6A4F;
  --red:#C0392B;
  --white:#FFFFFF;
  --card:#FFFFFF;
  --text:#1A1A2E;
  --soft:#6B6B80;
  --border:#E8E4DC;
  --r:14px;
  --sh:0 2px 16px rgba(0,0,0,0.08);
}
html,body{height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
#app{display:flex;flex-direction:column;height:100dvh;overflow:hidden}

/* TOPBAR */
.topbar{
  background:var(--dark);
  padding:14px 18px 12px;
  padding-top:max(14px,env(safe-area-inset-top));
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{font-size:26px}
.brand-name{
  font-family:'Playfair Display',serif;
  font-size:22px;font-weight:800;
  color:var(--white);letter-spacing:-0.5px;
}
.brand-name span{color:var(--accent)}
.brand-sub{font-size:10px;color:rgba(255,255,255,0.45);letter-spacing:1px;text-transform:uppercase;margin-top:1px}
.mode-toggle{display:flex;gap:3px;background:rgba(255,255,255,0.1);border-radius:10px;padding:4px}
.mode-btn{
  border:none;background:transparent;color:rgba(255,255,255,0.55);
  font-family:'Inter',sans-serif;font-size:11px;font-weight:600;
  padding:5px 12px;border-radius:7px;cursor:pointer;transition:all 0.18s;
}
.mode-btn.active{background:var(--accent);color:var(--white)}

/* TAB NAV */
.tab-nav{
  display:flex;background:var(--dark);
  border-bottom:1px solid rgba(255,255,255,0.08);flex-shrink:0;
}
.tab-btn{
  flex:1;border:none;background:transparent;
  color:rgba(255,255,255,0.45);font-family:'Inter',sans-serif;
  font-size:11px;font-weight:600;padding:9px 6px 8px;
  cursor:pointer;transition:all 0.18s;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  position:relative;letter-spacing:0.2px;
}
.tab-btn .ti{font-size:17px}
.tab-btn.active{color:var(--accent2)}
.tab-btn.active::after{
  content:'';position:absolute;bottom:0;left:25%;right:25%;
  height:2px;background:var(--accent);border-radius:2px 2px 0 0;
}
.badge{
  position:absolute;top:5px;right:18%;
  background:var(--accent);color:white;
  font-size:9px;font-weight:700;min-width:16px;height:16px;
  border-radius:8px;display:flex;align-items:center;justify-content:center;
  padding:0 4px;line-height:1;
}

/* CONTENT */
.content{flex:1;overflow-y:auto;overscroll-behavior:contain}
.panel{display:none;padding:14px}
.panel.active{display:block}

/* SECTION LABEL */
.sec-label{
  font-family:'Playfair Display',serif;
  font-size:18px;font-weight:700;color:var(--dark);
  margin:16px 0 10px 2px;display:flex;align-items:center;gap:8px;
}
.sec-label::after{content:'';flex:1;height:1px;background:var(--border)}
.sec-sub{font-size:11px;color:var(--soft);font-family:'Inter',sans-serif;font-weight:500}

/* MENU CARDS */
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px}

.menu-card{
  background:var(--card);border-radius:var(--r);
  box-shadow:var(--sh);overflow:hidden;cursor:pointer;
  transition:transform 0.12s,box-shadow 0.12s;
  position:relative;
}
.menu-card:active{transform:scale(0.97)}
.menu-card.in-cart{outline:2.5px solid var(--accent)}
.card-img{
  width:100%;height:90px;object-fit:cover;display:block;
  background:#E8E4DC;
}
.card-img-placeholder{
  width:100%;height:90px;
  background:linear-gradient(135deg,#e8e4dc,#d4cfc7);
  display:flex;align-items:center;justify-content:center;
  font-size:32px;
}
.card-body{padding:8px 10px 10px}
.card-name{font-size:12px;font-weight:700;color:var(--text);line-height:1.3}
.card-sub{font-size:10px;color:var(--soft);margin-top:2px;line-height:1.3}
.card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:7px;gap:4px}
.card-price{font-size:13px;font-weight:700;color:var(--dark);white-space:nowrap}
.card-actions{display:flex;align-items:center;gap:4px}
.tc-btn{
  border:1.5px solid var(--border);background:transparent;
  color:var(--soft);border-radius:6px;padding:3px 7px;
  font-family:'Inter',sans-serif;font-size:10px;font-weight:600;
  cursor:pointer;transition:all 0.15s;white-space:nowrap;
}
.tc-btn:hover{border-color:var(--accent);color:var(--accent)}
.add-btn{
  border:none;background:var(--accent);color:white;
  border-radius:8px;padding:4px 10px;font-family:'Inter',sans-serif;
  font-size:11px;font-weight:700;cursor:pointer;transition:background 0.15s;
  white-space:nowrap;
}
.card-qty{
  display:flex;align-items:center;gap:5px;
  background:var(--bg);border-radius:8px;padding:3px 7px;
}
.qty-btn{
  border:none;background:none;font-size:15px;font-weight:700;
  cursor:pointer;color:var(--dark);line-height:1;
  width:18px;height:18px;display:flex;align-items:center;justify-content:center;
}
.qty-val{font-size:12px;font-weight:800;min-width:14px;text-align:center}

/* CART */
.cart-empty{text-align:center;padding:48px 20px;color:var(--soft)}
.cart-empty .big{font-size:48px;margin-bottom:12px}
.cart-empty p{font-size:15px}

.cart-item{
  background:var(--card);border-radius:var(--r);
  box-shadow:var(--sh);display:flex;align-items:center;gap:10px;
  margin-bottom:10px;overflow:hidden;
}
.ci-img{width:64px;height:64px;object-fit:cover;flex-shrink:0}
.ci-img-ph{width:64px;height:64px;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.ci-info{flex:1;padding:8px 0;min-width:0}
.ci-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-price{font-size:11px;color:var(--soft);margin-top:2px}
.ci-right{display:flex;align-items:center;gap:8px;padding-right:12px}
.ci-qty{display:flex;align-items:center;gap:7px;background:var(--bg);border-radius:8px;padding:4px 9px}
.ci-qty-val{font-size:13px;font-weight:800;min-width:16px;text-align:center}
.ci-del{border:none;background:none;font-size:16px;cursor:pointer;opacity:0.35;padding:4px}

.order-summary{
  background:var(--dark);color:var(--white);
  border-radius:var(--r);padding:16px;margin:12px 0;
}
.sum-row{display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px;opacity:0.8}
.sum-row.total{font-size:17px;font-weight:700;opacity:1;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.15)}

/* ORDER FORM */
.form-card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:10px;box-shadow:var(--sh)}
.form-card label{font-size:11px;font-weight:700;color:var(--soft);display:block;margin-bottom:6px;letter-spacing:0.5px;text-transform:uppercase}
.form-card input,.form-card select{
  width:100%;border:1.5px solid var(--border);border-radius:9px;
  padding:11px 13px;font-family:'Inter',sans-serif;font-size:14px;
  outline:none;transition:border 0.15s;color:var(--text);background:var(--bg);
}
.form-card input:focus,.form-card select:focus{border-color:var(--accent);background:var(--white)}
.form-card input::placeholder{color:#aaa}

.submit-btn{
  width:100%;background:var(--accent);color:white;border:none;
  border-radius:var(--r);padding:16px;font-family:'Inter',sans-serif;
  font-size:15px;font-weight:700;cursor:pointer;margin-bottom:32px;
  transition:background 0.15s;letter-spacing:0.2px;
}
.submit-btn:hover{background:var(--accent2)}
.submit-btn:disabled{opacity:0.5;cursor:not-allowed}

/* ORDERS */
.orders-filter{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px}
.filter-chip{
  flex-shrink:0;border:1.5px solid var(--border);background:var(--card);
  border-radius:20px;padding:6px 14px;font-family:'Inter',sans-serif;
  font-size:11px;font-weight:700;cursor:pointer;color:var(--soft);
  transition:all 0.15s;white-space:nowrap;
}
.filter-chip.active{background:var(--dark);border-color:var(--dark);color:white}

.order-card{
  background:var(--card);border-radius:var(--r);
  box-shadow:var(--sh);padding:14px;margin-bottom:12px;
  border-left:4px solid var(--border);
}
.order-card.status-new{border-left-color:var(--accent)}
.order-card.status-preparing{border-left-color:#2980B9}
.order-card.status-ready{border-left-color:var(--green)}
.order-card.status-done{border-left-color:var(--border);opacity:0.6}

.order-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
.order-num{font-size:15px;font-weight:800;color:var(--dark)}
.order-time{font-size:11px;color:var(--soft)}
.order-customer{font-size:13px;color:var(--soft);margin-bottom:2px}
.order-ready-time{font-size:12px;font-weight:600;color:var(--accent);margin-bottom:8px}

.status-badge{font-size:11px;font-weight:700;border-radius:6px;padding:3px 9px;display:inline-block;margin-bottom:8px}
.status-badge.new{background:#FEF3C7;color:#92400E}
.status-badge.preparing{background:#DBEAFE;color:#1E40AF}
.status-badge.ready{background:#D1FAE5;color:#065F46}
.status-badge.done{background:#F3F4F6;color:#6B7280}

.order-items-list{margin:6px 0 10px}
.oi{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid var(--border)}
.oi:last-child{border-bottom:none}
.oi-qty{color:var(--soft);font-weight:700}
.order-total-line{font-size:12px;font-weight:700;color:var(--soft);margin-bottom:8px}
.order-phone{font-size:12px;color:var(--soft);margin-bottom:4px}

.order-actions{display:flex;gap:8px;flex-wrap:wrap}
.action-btn{
  flex:1;min-width:70px;border:none;border-radius:9px;padding:8px 10px;
  font-family:'Inter',sans-serif;font-size:11px;font-weight:700;
  cursor:pointer;transition:all 0.15s;text-align:center;
}
.btn-prepare{background:#DBEAFE;color:#1E40AF}
.btn-ready{background:#D1FAE5;color:#065F46}
.btn-done{background:#F3F4F6;color:#6B7280}
.btn-cancel{background:#FEE2E2;color:#991B1B}

/* STATS */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat-card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;text-align:center}
.stat-icon{font-size:26px;margin-bottom:6px}
.stat-val{font-size:24px;font-weight:800;color:var(--dark)}
.stat-label{font-size:11px;color:var(--soft);margin-top:2px}
.stat-card.hi{background:var(--dark);color:white}
.stat-card.hi .stat-val{color:var(--accent2)}
.stat-card.hi .stat-label{color:rgba(255,255,255,0.55)}
.recent-item{
  background:var(--card);border-radius:10px;padding:10px 14px;
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:8px;box-shadow:0 1px 6px rgba(0,0,0,0.06);
}
.ri-name{font-size:13px;font-weight:700}
.ri-cust{font-size:11px;color:var(--soft)}
.ri-amount{font-size:14px;font-weight:800;color:var(--dark)}

/* MODAL */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.6);
  z-index:200;display:flex;align-items:flex-end;
  opacity:0;pointer-events:none;transition:opacity 0.25s;
}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal-box{
  background:var(--white);border-radius:20px 20px 0 0;
  width:100%;max-height:90dvh;overflow-y:auto;
  padding:0 0 32px;
  transform:translateY(60px);
  transition:transform 0.3s cubic-bezier(.34,1.2,.64,1);
}
.modal-overlay.open .modal-box{transform:translateY(0)}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 0}
.modal-dish-img{width:100%;height:180px;object-fit:cover;display:block}
.modal-dish-ph{width:100%;height:180px;background:linear-gradient(135deg,#e8e4dc,#ccc);display:flex;align-items:center;justify-content:center;font-size:56px}
.modal-head{padding:14px 18px 8px;position:relative}
.modal-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:800;color:var(--text)}
.modal-sub{font-size:13px;color:var(--soft);margin-top:3px}
.modal-price{font-size:18px;font-weight:800;color:var(--accent);margin-top:6px}
.modal-close{
  position:absolute;top:14px;right:16px;
  border:none;background:var(--bg);border-radius:50%;
  width:32px;height:32px;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:var(--soft);
}
.modal-body{padding:0 18px}
.tc-fact{
  background:linear-gradient(135deg,#FEF9F0,#FFF3E0);
  border-left:4px solid var(--accent);
  border-radius:10px;padding:12px 14px;margin-bottom:14px;
  font-size:13px;color:var(--text);line-height:1.6;
}
.tc-fact::before{content:'💡 '}
.tc-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.tc-meta-item{background:var(--bg);border-radius:10px;padding:10px 4px;text-align:center}
.tc-meta-val{font-size:15px;font-weight:800;color:var(--dark)}
.tc-meta-lbl{font-size:9px;color:var(--soft);margin-top:2px;line-height:1.3}
.tc-section{
  font-size:10px;font-weight:700;letter-spacing:0.7px;
  text-transform:uppercase;color:var(--soft);margin:12px 0 8px;
}
.tc-table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:14px}
.tc-table th{background:var(--dark);color:white;padding:7px 8px;text-align:left;font-weight:700}
.tc-table th:not(:first-child){text-align:right}
.tc-table td{padding:5px 8px;border-bottom:1px solid var(--border)}
.tc-table td:not(:first-child){text-align:right;color:var(--soft)}
.tc-table tfoot td{font-weight:700;border-top:2px solid var(--border);border-bottom:none}
.tc-tech{background:var(--bg);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.7;color:var(--text)}
.modal-add-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-top:1px solid var(--border);margin-top:14px;
}
.modal-add-btn{
  border:none;background:var(--accent);color:white;
  border-radius:10px;padding:12px 24px;font-family:'Inter',sans-serif;
  font-size:14px;font-weight:700;cursor:pointer;
}
.modal-qty-ctrl{display:flex;align-items:center;gap:12px}
.modal-qty-btn{
  border:1.5px solid var(--border);background:var(--bg);
  border-radius:50%;width:36px;height:36px;font-size:18px;font-weight:700;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--dark);
}
.modal-qty-val{font-size:18px;font-weight:800;min-width:24px;text-align:center}

/* OFFLINE / INSTALL */
.offline-bar{background:#B45309;color:white;text-align:center;font-size:12px;font-weight:700;padding:6px;display:none;flex-shrink:0}
.offline-bar.show{display:block}
.install-bar{background:var(--dark2);color:white;display:none;align-items:center;justify-content:space-between;padding:10px 16px;gap:10px;flex-shrink:0}
.install-bar.show{display:flex}
.install-bar p{font-size:12px;font-weight:600}
.inst-btn{border:none;border-radius:8px;padding:6px 12px;font-family:'Inter',sans-serif;font-size:11px;font-weight:700;cursor:pointer}
.inst-btn.pri{background:var(--accent);color:white}
.inst-btn.sec{background:transparent;color:rgba(255,255,255,0.5)}

/* TOAST */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--dark);color:white;border-radius:12px;
  padding:12px 22px;font-size:13px;font-weight:700;
  box-shadow:0 4px 20px rgba(0,0,0,0.2);transition:transform 0.3s cubic-bezier(.34,1.56,.64,1);
  z-index:999;white-space:nowrap;
}
.toast.show{transform:translateX(-50%) translateY(0)}

@media(min-width:480px){.menu-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:700px){
  #app{max-width:480px;margin:0 auto;box-shadow:0 0 40px rgba(0,0,0,0.12)}
  body{background:#E0DDD8;display:flex;justify-content:center}
}
</style>
</head>
<body>
<div id="app">

<div class="offline-bar" id="offlineBar">⚠️ Немає з'єднання</div>
<div class="install-bar" id="installBar">
  <p>📲 Встановити ЇжКо на пристрій</p>
  <div style="display:flex;gap:8px">
    <button class="inst-btn pri" id="installBtn">Встановити</button>
    <button class="inst-btn sec" id="installDismiss">Пізніше</button>
  </div>
</div>

<!-- TOPBAR -->
<div class="topbar">
  <div class="brand">
    <span class="brand-logo">🍴</span>
    <div>
      <div class="brand-name">Їж<span>Ко</span></div>
      <div class="brand-sub">Замовлення онлайн</div>
    </div>
  </div>
  <div class="mode-toggle">
    <button class="mode-btn active" id="modeClient" onclick="setMode('client')">Клієнт</button>
    <button class="mode-btn" id="modeKitchen" onclick="setMode('kitchen')">Кухня</button>
  </div>
</div>

<!-- TAB NAV -->
<nav class="tab-nav">
  <button class="tab-btn active" onclick="showTab('menu')" id="tab-menu">
    <span class="ti">🥗</span>Меню
  </button>
  <button class="tab-btn" onclick="showTab('cart')" id="tab-cart">
    <span class="ti">🛒</span>Кошик
    <span class="badge" id="cartBadge" style="display:none">0</span>
  </button>
  <button class="tab-btn" onclick="showTab('orders')" id="tab-orders">
    <span class="ti">📋</span>Замовлення
    <span class="badge" id="ordersBadge" style="display:none">0</span>
  </button>
  <button class="tab-btn" onclick="showTab('stats')" id="tab-stats">
    <span class="ti">📊</span>Звіт
  </button>
</nav>

<!-- CONTENT -->
<div class="content">
  <div class="panel active" id="panel-menu"><div id="menuContent"></div></div>
  <div class="panel" id="panel-cart"><div id="cartContent"></div></div>
  <div class="panel" id="panel-orders">
    <div class="orders-filter" id="ordersFilter">
      <button class="filter-chip active" onclick="filterOrders('all')">Усі</button>
      <button class="filter-chip" onclick="filterOrders('new')">🔶 Нові</button>
      <button class="filter-chip" onclick="filterOrders('preparing')">🔵 Готується</button>
      <button class="filter-chip" onclick="filterOrders('ready')">🟢 Готово</button>
      <button class="filter-chip" onclick="filterOrders('done')">✓ Видано</button>
    </div>
    <div id="ordersContent"></div>
  </div>
  <div class="panel" id="panel-stats"><div id="statsContent"></div></div>
</div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="tcModal" onclick="closeTCModal(event)">
  <div class="modal-box" id="tcBox">
    <button class="modal-close" onclick="closeTCModalForce()">✕</button>
    <div class="modal-handle"></div>
    <div id="tcImgArea"></div>
    <div class="modal-head">
      <div class="modal-title" id="tcTitle"></div>
      <div class="modal-sub" id="tcSub"></div>
      <div class="modal-price" id="tcPrice"></div>
    </div>
    <div class="modal-body" id="tcBody"></div>
    <div class="modal-add-row">
      <div class="modal-qty-ctrl">
        <button class="modal-qty-btn" id="mqMinus">−</button>
        <span class="modal-qty-val" id="mqVal">1</span>
        <button class="modal-qty-btn" id="mqPlus">+</button>
      </div>
      <button class="modal-add-btn" id="mqAdd">Додати до кошика</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══ MENU DATA ══════════════════════════════════════════════
const MENU = [

let cart   = {};
let orders = loadOrders();
let currentFilter = 'all';
let currentMode   = 'client';

function loadOrders(){
  try{ return JSON.parse(localStorage.getItem('yizhko_orders')||'[]'); }
  catch{ return []; }
}
function saveOrders(){ localStorage.setItem('yizhko_orders', JSON.stringify(orders)); }

// ══ RENDER MENU ═══════════════════════════════════════════
function renderMenu(){
  const cats = [...new Set(MENU.map(i=>i.cat))];
  let html = '';
  cats.forEach(cat=>{
    const items = MENU.filter(i=>i.cat===cat);
    const catEmoji = {
      'Перші страви':'🍲','Основні страви':'🍽️','Гарніри':'🥔','Салати':'🥗','Окремі страви':'⭐'
    }[cat]||'🍴';
    html += '<div class="sec-label">' + catEmoji + ' ' + cat + '</div>';
    html += '<div class="menu-grid">';
    items.forEach(item=>{
      const qty = cart[item.id]||0;
      const imgTag = item.img
        ? '<img class="card-img" src="' + item.img + '" alt="' + item.name + '" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">'
          + '<div class="card-img-placeholder" style="display:none">' + item.emoji + '</div>'
        : '<div class="card-img-placeholder">' + item.emoji + '</div>';
      const qtyHtml = qty > 0
        ? '<div class="card-qty"><button class="qty-btn" onclick="event.stopPropagation();changeQty(' + item.id + ',-1)">−</button><span class="qty-val">' + qty + '</span><button class="qty-btn" onclick="event.stopPropagation();changeQty(' + item.id + ',1)">+</button></div>'
        : '<button class="add-btn" onclick="event.stopPropagation();changeQty(' + item.id + ',1)">+ Додати</button>';
      html += '<div class="menu-card' + (qty>0?' in-cart':'') + '" onclick="openTC(' + item.id + ')">'
        + imgTag
        + '<div class="card-body">'
        + '<div class="card-name">' + item.name + '</div>'
        + '<div class="card-sub">' + item.sub + '</div>'
        + '<div class="card-footer">'
        + '<div class="card-price">' + item.price + ' грн</div>'
        + '<div class="card-actions">'
        + '<button class="tc-btn" onclick="event.stopPropagation();openTC(' + item.id + ')">ТК</button>'
        + qtyHtml
        + '</div></div></div></div>';
    });
    html += '</div>';
  });
  document.getElementById('menuContent').innerHTML = html;
}

function changeQty(id, delta){
  cart[id] = Math.max(0,(cart[id]||0)+delta);
  if(cart[id]===0) delete cart[id];
  updateCartBadge();
  renderMenu();
}
function updateCartBadge(){
  const total = Object.values(cart).reduce((s,v)=>s+v,0);
  const b = document.getElementById('cartBadge');
  b.textContent = total;
  b.style.display = total>0?'flex':'none';
}

// ══ RENDER CART ═══════════════════════════════════════════
function renderCart(){
  const keys = Object.keys(cart).map(Number);
  const el = document.getElementById('cartContent');
  if(!keys.length){
    el.innerHTML = '<div class="cart-empty"><div class="big">🛒</div><p>Кошик порожній.<br>Оберіть страви з меню.</p></div>';
    return;
  }
  let totalQty=0, totalPrice=0;
  let html='';
  keys.forEach(id=>{
    const item = MENU.find(i=>i.id===id);
    const qty  = cart[id];
    totalQty  += qty;
    totalPrice+= qty*item.price;
    const imgHtml = item.img
      ? '<img class="ci-img" src="' + item.img + '" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">'
        + '<div class="ci-img-ph" style="display:none">' + item.emoji + '</div>'
      : '<div class="ci-img-ph">' + item.emoji + '</div>';
    html += '<div class="cart-item">'
      + imgHtml
      + '<div class="ci-info"><div class="ci-name">' + item.name + '</div>'
      + '<div class="ci-price">' + item.price + ' грн × ' + qty + ' = ' + (item.price*qty) + ' грн</div></div>'
      + '<div class="ci-right">'
      + '<div class="ci-qty"><button class="qty-btn" onclick="changeQty(' + id + ',-1)">−</button><span class="ci-qty-val">' + qty + '</span><button class="qty-btn" onclick="changeQty(' + id + ',1)">+</button></div>'
      + '<button class="ci-del" onclick="changeQty(' + id + ',-999)">✕</button>'
      + '</div></div>';
  });
  html += '<div class="order-summary">'
    + '<div class="sum-row"><span>Позицій</span><span>' + keys.length + '</span></div>'
    + '<div class="sum-row"><span>Порцій</span><span>' + totalQty + '</span></div>'
    + '<div class="sum-row total"><span>До сплати</span><span>' + totalPrice + ' грн</span></div>'
    + '</div>'
    + '<div class="form-card"><label>Ваше імʼя</label><input type="text" id="custName" placeholder="Олена Коваль" maxlength="50"></div>'
    + '<div class="form-card"><label>Номер телефону</label><input type="tel" id="custPhone" placeholder="+380 XX XXX XX XX" maxlength="20"></div>'
    + '<div class="form-card"><label>Готове до (година)</label><input type="time" id="custTime" min="08:00" max="20:00"></div>'
    + '<button class="submit-btn" onclick="submitOrder()">✓ Оформити замовлення — ' + totalPrice + ' грн</button>';
  el.innerHTML = html;
  // set default time +30min
  const now = new Date();
  now.setMinutes(now.getMinutes()+30);
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  const timeEl = document.getElementById('custTime');
  if(timeEl) timeEl.value = hh+':'+mm;
}

function submitOrder(){
  const name  = document.getElementById('custName')?.value.trim();
  const phone = document.getElementById('custPhone')?.value.trim();
  const time  = document.getElementById('custTime')?.value;
  if(!name)  { showToast('⚠️ Введіть імʼя'); return; }
  if(!phone) { showToast('⚠️ Введіть номер телефону'); return; }
  if(!time)  { showToast('⚠️ Вкажіть час готовності'); return; }
  const items = Object.entries(cart).map(([id,qty])=>{
    const item = MENU.find(i=>i.id==id);
    return {id:+id, name:item.name, emoji:item.emoji, price:item.price, qty};
  });
  const total = items.reduce((s,i)=>s+i.price*i.qty,0);
  orderCounter++;
  const order = {
    num:orderCounter, name, phone, time,
    items, total, status:'new',
    created: new Date().toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'}),
    date: new Date().toLocaleDateString('uk-UA'),
  };
  orders.unshift(order);
  saveOrders();
  cart={};
  updateCartBadge();
  updateOrdersBadge();
  showToast('✅ Замовлення №' + orderCounter + ' прийнято!');
  showTab('orders');
}

// ══ RENDER ORDERS ═════════════════════════════════════════
const STATUS_MAP = {
  new:       {label:'Нове',      cls:'new',       emoji:'🔶'},
  preparing: {label:'Готується', cls:'preparing', emoji:'🔵'},
  ready:     {label:'Готово',    cls:'ready',      emoji:'🟢'},
  done:      {label:'Видано',    cls:'done',       emoji:'✓'},
};
function renderOrders(){
  const filtered = currentFilter==='all' ? orders : orders.filter(o=>o.status===currentFilter);
  const el = document.getElementById('ordersContent');
  if(!filtered.length){
    el.innerHTML='<div class="cart-empty"><div class="big">📋</div><p>Замовлень немає</p></div>';
    return;
  }
  let html='';
  filtered.forEach(order=>{
    const s = STATUS_MAP[order.status];
    html += '<div class="order-card status-' + order.status + '">'
      + '<div class="order-header"><div>'
      + '<div class="order-num">№' + order.num + '</div>'
      + '<div class="order-customer">👤 ' + order.name + '</div>'
      + '<div class="order-phone">📞 ' + order.phone + '</div>'
      + '</div><div class="order-time">' + order.created + '</div></div>'
      + '<div class="order-ready-time">⏰ Готове до: ' + order.time + '</div>'
      + '<span class="status-badge ' + s.cls + '">' + s.emoji + ' ' + s.label + '</span>'
      + '<div class="order-items-list">'
      + order.items.map(i=>'<div class="oi"><span>' + i.emoji + ' ' + i.name + '</span><span class="oi-qty">' + i.qty + ' шт.</span></div>').join('')
      + '</div>'
      + '<div class="order-total-line">Разом: ' + order.total + ' грн</div>'
      + '<div class="order-actions">'
      + (order.status==='new' ? '<button class="action-btn btn-prepare" onclick="setStatus(' + order.num + ',\'preparing\')">🔵 Готувати</button>' : '')
      + (order.status==='preparing' ? '<button class="action-btn btn-ready" onclick="setStatus(' + order.num + ',\'ready\')">🟢 Готово</button>' : '')
      + (order.status==='ready' ? '<button class="action-btn btn-done" onclick="setStatus(' + order.num + ',\'done\')">✓ Видано</button>' : '')
      + (order.status!=='done' ? '<button class="action-btn btn-cancel" onclick="cancelOrder(' + order.num + ')">✕ Скасувати</button>' : '')
      + '</div></div>';
  });
  el.innerHTML = html;
}
function setStatus(num,status){
  const o = orders.find(o=>o.num===num);
  if(o){ o.status=status; saveOrders(); updateOrdersBadge(); renderOrders(); }
  const labels={preparing:'готується',ready:'готово!',done:'видано'};
  showToast('№' + num + ': ' + (labels[status]||status));
}
function cancelOrder(num){
  orders=orders.filter(o=>o.num!==num);
  saveOrders(); updateOrdersBadge(); renderOrders();
  showToast('Замовлення №' + num + ' скасовано');
}
function filterOrders(f){
  currentFilter=f;
  document.querySelectorAll('.filter-chip').forEach(btn=>{
    const map={all:'Усі',new:'Нові',preparing:'Готується',ready:'Готово',done:'Видано'};
    btn.classList.toggle('active', btn.textContent.trim().includes(map[f]));
  });
  renderOrders();
}
function updateOrdersBadge(){
  const active=orders.filter(o=>o.status!=='done').length;
  const b=document.getElementById('ordersBadge');
  b.textContent=active;
  b.style.display=active>0?'flex':'none';
}

function openTC(id){
  const item = MENU.find(i=>i.id===id);
  if(!item||!item.techcard) return;
  modalItemId = id;
  modalQty = cart[id]||1;
  const tc = item.techcard;
  document.getElementById('tcTitle').textContent = item.name;
  document.getElementById('tcSub').textContent   = item.sub;
  document.getElementById('tcPrice').textContent = item.price + ' грн';
  document.getElementById('mqVal').textContent   = modalQty;

  const imgArea = document.getElementById('tcImgArea');
  imgArea.innerHTML = item.img
    ? '<img class="modal-dish-img" src="' + item.img + '" onerror="this.parentElement.innerHTML=\'<div class=modal-dish-ph>' + item.emoji + '</div>\'">'
    : '<div class="modal-dish-ph">' + item.emoji + '</div>';

  const totB = tc.ingredients.reduce((s,i)=>s+(i.b||0),0);
  const totN = tc.ingredients.reduce((s,i)=>s+(i.n||0),0);

    '<tr><td>' + i.name + '</td><td>' + i.b + '</td><td>' + i.n + '</td><td>' + (i.l||0) + '%</td></tr>'

  document.getElementById('tcBody').innerHTML =

    + '<div class="tc-meta">'
    + '<div class="tc-meta-item"><div class="tc-meta-val">' + tc.portion + '</div><div class="tc-meta-lbl">вихід, г</div></div>'

    + '<div class="tc-meta-item"><div class="tc-meta-val">' + tc.b + '</div><div class="tc-meta-lbl">білки, г</div></div>'
    + '<div class="tc-meta-item"><div class="tc-meta-val">' + tc.f + '/' + tc.c + '</div><div class="tc-meta-lbl">жири/вугл.</div></div>'
    + '</div>'
    + '<div class="tc-section">Інгредієнти на 1 порцію</div>'
    + '<table class="tc-table"><thead><tr><th>Найменування</th><th>Брутто</th><th>Нетто</th><th>Втрати</th></tr></thead>'
    + '<tbody>' + rows + '</tbody>'
    + '<tfoot><tr><td>Разом</td><td>' + Math.round(totB) + '</td><td>' + Math.round(totN) + '</td><td>—</td></tr></tfoot></table>'
    + '<div class="tc-section">Технологія приготування</div>'
    + '<div class="tc-tech">' + tc.tech + '</div>';

  document.getElementById('tcModal').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeTCModal(e){
  if(e && !e.target.classList.contains('modal-overlay')) return;
  closeTCModalForce();
}
function closeTCModalForce(){
  document.getElementById('tcModal').classList.remove('open');
  document.body.style.overflow='';
}
document.getElementById('mqMinus').onclick = ()=>{
  modalQty = Math.max(1, modalQty-1);
  document.getElementById('mqVal').textContent = modalQty;
};
document.getElementById('mqPlus').onclick = ()=>{
  modalQty++;
  document.getElementById('mqVal').textContent = modalQty;
};
document.getElementById('mqAdd').onclick = ()=>{
  if(modalItemId){
    cart[modalItemId] = (cart[modalItemId]||0) + modalQty;
    updateCartBadge();
    showToast('✅ Додано до кошика ×' + modalQty);
    closeTCModalForce();
    renderMenu();
  }
};
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeTCModalForce(); });

// ══ TABS & MODE ═══════════════════════════════════════════
function showTab(tab){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('panel-'+tab).classList.add('active');
  document.getElementById('tab-'+tab).classList.add('active');
  if(tab==='menu')   renderMenu();
  if(tab==='cart')   renderCart();
  if(tab==='orders') renderOrders();
  if(tab==='stats')  renderStats();
}
function setMode(mode){
  currentMode=mode;
  document.getElementById('modeClient').classList.toggle('active', mode==='client');
  document.getElementById('modeKitchen').classList.toggle('active', mode==='kitchen');
  if(mode==='kitchen') showTab('orders');
  else showTab('menu');
}

// ══ TOAST ═════════════════════════════════════════════════
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}

// ══ PWA ═══════════════════════════════════════════════════
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('/sw.js').catch(()=>{}); });
}
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault(); deferredPrompt=e;
  document.getElementById('installBar').classList.add('show');
});
document.getElementById('installBtn').addEventListener('click',async()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  const {outcome}=await deferredPrompt.userChoice;
  deferredPrompt=null;
  document.getElementById('installBar').classList.remove('show');
  if(outcome==='accepted') showToast('✅ Додаток встановлено!');
});
document.getElementById('installDismiss').addEventListener('click',()=>{
  document.getElementById('installBar').classList.remove('show');
});
window.addEventListener('online', ()=>document.getElementById('offlineBar').classList.remove('show'));
window.addEventListener('offline',()=>document.getElementById('offlineBar').classList.add('show'));

// ══ INIT ══════════════════════════════════════════════════
updateCartBadge();
updateOrdersBadge();
renderMenu();
</script>
</body>
</html>
